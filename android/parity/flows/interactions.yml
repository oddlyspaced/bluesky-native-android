appId: ${APP_ID}
---
# Like and repost the first post (Thread root), then capture home and the thread with its stats row.
- runScript:
    file: ../setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- runFlow:
    file: setup-app.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible:
      id: "feedItem-by-alice.test"
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: "likeBtn"
    index: 0
- extendedWaitUntil:
    visible:
      id: "likeCount"
    timeout: 10000
- tapOn:
    id: "repostBtn"
    index: 0
- tapOn: "Repost"
- extendedWaitUntil:
    visible:
      id: "repostCount"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: shots/${PREFIX}-home
- tapOn: "Thread root"
# "Thread reply" is also on the home feed, so wait for the thread anchor, which only the thread screen has.
- extendedWaitUntil:
    visible:
      id: "postThreadItem-by-bob.test"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: shots/${PREFIX}-thread
