appId: ${APP_ID}
---
# Sign in, then reseed so the signed-in session and the loaded posts no longer exist on the server.
# Open the cached thread and pull to refresh the feed, and capture what each app shows.
- runScript:
    file: ../../setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- runFlow:
    file: ../setup-app.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible:
      id: "feedItem-by-alice.test"
    timeout: 60000
- waitForAnimationToEnd
- runScript:
    file: ../../setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- tapOn: "Thread root"
- extendedWaitUntil:
    visible: "Error loading post"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: thread
- back
# Pull to refresh. RN PostFeed refreshFeed runs truncateAndInvalidate (keep page 1, refetch). After the reseed the
# old session gets HTTP 500 from getTimeline, so both apps end in the failed-refresh state: page 1 rows plus the
# load-more retry row (PostFeed.tsx `isError && !isEmpty`). Wait for that row, so the screenshot is taken after the
# refresh has failed and not before it starts (React Query retries first).
# Soft reset instead of a pull gesture: pressing the active Home tab runs the same refresh path in both apps
# (RN Home.tsx onSoftReset -> truncateAndInvalidate; native TabBackStacks.Press.SoftReset -> FeedViewModel.refresh).
# A swipe did not start RN's RefreshControl in this flow, so the RN capture never reached the failed refresh.
- tapOn:
    id: "bottomBarHomeBtn"
# Native reaches the failed-refresh state (page 1 rows plus the load-more retry row). RN does not: with the same
# gesture its feed query is not refetched, so it keeps the cached pages and shows FollowingEndOfFeed. Measured on
# 2026-09-16 with three gestures (swipe 40-80%, swipe 30-90%, Home tab soft reset); RN never rendered the retry row,
# although its thread query did fail ("Error loading post"). The wait is therefore optional: each app is captured at
# its own settled state after the same gesture, and PARITY.md records the difference.
- extendedWaitUntil:
    visible: "There was an issue fetching posts. Tap here to try again."
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: home
