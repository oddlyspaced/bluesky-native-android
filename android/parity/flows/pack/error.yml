appId: ${APP_ID}
---
# Sign in, then reseed so the signed-in session and the loaded posts no longer exist on the server.
# Open the cached thread and pull to refresh the feed, and capture what each app shows.
- runScript:
    file: ../../setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- runFlow:
    file: ../setup-app.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible:
      id: "feedItem-by-alice.test"
    timeout: 60000
- waitForAnimationToEnd
- runScript:
    file: ../../setupServer.js
    env:
      SERVER_PATH: "?users&follows&posts&feeds&thread"
- tapOn: "Thread root"
- extendedWaitUntil:
    visible: "Error loading post"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: thread
- back
- waitForAnimationToEnd
# Soft reset the Home tab. Both apps wire the same refresh path to it:
#   RN      BottomBar.onPressTab -> getTabState(...) === InsideAtRoot -> emitSoftReset()
#           -> FeedPage.onSoftReset -> truncateAndInvalidate + feed:refresh {reason: "soft-reset"}
#   native  TabBackStacks.press -> Press.SoftReset -> FeedViewModel.refresh(REASON_SOFT_RESET)
#
# Press twice. RN `getTabState` descends to the deepest focused route (src/lib/routes/helpers.ts:69-80), so while
# PostThread is still the focused route the first press reads `Inside` and only pops the tab stack to its root;
# the second press reads `InsideAtRoot` and emits the soft reset. A single press was therefore consumed by the
# pop and never reached `FeedPage.onSoftReset`, which is why the earlier RN capture kept its cached pages and
# still rendered FollowingEndOfFeed (review A4). The native stacks behave the same way: the first press pops to
# the root, the second soft resets. The RN event log for this capture is the proof that the refresh ran.
- tapOn:
    id: "bottomBarHomeBtn"
- waitForAnimationToEnd
- tapOn:
    id: "bottomBarHomeBtn"
# After the reseed `getTimeline` fails for the old session, so a refresh that runs ends in the failed-refresh
# state: page 1 rows plus the load-more retry row (PostFeed.tsx `isError && !isEmpty`). React Query retries first,
# so wait for the row instead of screenshotting mid-refresh. The wait stays optional so a flow can never hold the
# seed lock on this assertion: each app is captured at the state it settles in, and the event logs say what ran.
- extendedWaitUntil:
    visible: "There was an issue fetching posts. Tap here to try again."
    timeout: 60000
    optional: true
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: home
