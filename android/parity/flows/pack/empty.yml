appId: ${APP_ID}
---
# Accounts and follows only, no posts: the empty Following feed and the empty profile Posts tab.
- runScript:
    file: ../../setupServer.js
    env:
      SERVER_PATH: "?users&follows"
- runFlow:
    file: ../setup-app.yml
- tapOn:
    id: "e2eSignInAlice"
- extendedWaitUntil:
    visible: "You can also discover new Custom Feeds to follow."
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 15000
# The first screenshot of a flow lands while Android is still fading the ScrollView's scrollbar,
# which it awakens at first layout. React Native's feed is a ScrollView and gets one; a Compose
# LazyColumn never draws one, so the fade decides 0.40% to 0.44% of this screen by itself. Every
# later screenshot in every flow is taken after the fade: `thread` and `profile` here show no
# scrollbar even though `thread` follows a scroll. Only the first was inconsistent.
#
# `waitForAnimationToEnd` does not cover it, because a timed alpha fade is not the kind of change
# it samples for. This waits for a condition that never comes true, which is Maestro's idiom for a
# fixed delay, so the screenshot records the settled screen the flow already means to record.
# The missing indicator is still a difference and is still counted: PARITY.md difference 6.
- extendedWaitUntil:
    notVisible: "Following"
    timeout: 2500
    optional: true
- takeScreenshot: home
- tapOn:
    id: "bottomBarProfileBtn"
# Wait for the loaded Posts tab, not only the profile header: RN shows ProfileHeaderLoading while the profile
# query is pending (Profile.tsx `isDidPending || isProfilePending`), then the feed. The empty seed still creates
# the six follows (mock-server.ts `follows`), so alice has 2 followers and 2 following, as in the full seed.
- extendedWaitUntil:
    visible: "No posts yet"
    timeout: 90000
- runFlow:
    file: wait-profile-counts.yml
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: profile
